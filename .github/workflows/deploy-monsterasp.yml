name: deploy-monsterasp

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore backend/GroceryStore.sln
      - name: Build and test
        run: dotnet test backend/GroceryStore.sln --configuration Release --no-restore
      - name: Create protected Web Deploy profile
        shell: pwsh
        env:
          PUBLISH_PROFILE: ${{ secrets.MONSTERASP_PUBLISH_PROFILE }}
          PRODUCTION_SETTINGS: ${{ secrets.MONSTERASP_APPSETTINGS_PRODUCTION }}
          PRODUCTION_SQL_CONNECTION_STRING: ${{ secrets.MONSTERASP_SQL_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLISH_PROFILE)) {
            throw "MONSTERASP_PUBLISH_PROFILE is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_SETTINGS)) {
            throw "MONSTERASP_APPSETTINGS_PRODUCTION is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_SQL_CONNECTION_STRING)) {
            throw "MONSTERASP_SQL_CONNECTION_STRING is not configured."
          }

          try {
            $productionSettings = $env:PRODUCTION_SETTINGS | ConvertFrom-Json -ErrorAction Stop
          }
          catch {
            throw "MONSTERASP_APPSETTINGS_PRODUCTION must contain valid JSON."
          }

          if ($null -eq $productionSettings.ConnectionStrings) {
            $productionSettings | Add-Member -NotePropertyName "ConnectionStrings" -NotePropertyValue ([pscustomobject]@{})
          }
          $productionSettings.ConnectionStrings | Add-Member -Force -NotePropertyName "DefaultConnection" -NotePropertyValue $env:PRODUCTION_SQL_CONNECTION_STRING
          [System.IO.File]::WriteAllText(
            "backend/src/GroceryStore.Api/appsettings.Production.json",
            ($productionSettings | ConvertTo-Json -Depth 20))
          [xml]$publishSettings = $env:PUBLISH_PROFILE
          $webDeployProfile = @($publishSettings.publishData.publishProfile | Where-Object { $_.publishMethod -eq "MSDeploy" }) | Select-Object -First 1
          if ($null -eq $webDeployProfile) {
            throw "MONSTERASP_PUBLISH_PROFILE must contain an MSDeploy publish profile."
          }

          $profileDirectory = "backend/src/GroceryStore.Api/Properties/PublishProfiles"
          New-Item -ItemType Directory -Force -Path $profileDirectory | Out-Null
          $profileXml = @"
          <Project>
            <PropertyGroup>
              <WebPublishMethod>MSDeploy</WebPublishMethod>
              <PublishProvider>WebDeploy</PublishProvider>
              <LastUsedBuildConfiguration>Release</LastUsedBuildConfiguration>
              <MSDeployServiceURL>$($webDeployProfile.publishUrl)</MSDeployServiceURL>
              <DeployIisAppPath>$($webDeployProfile.msdeploySite)</DeployIisAppPath>
              <UserName>$($webDeployProfile.userName)</UserName>
              <Password>$($webDeployProfile.userPWD)</Password>
              <AllowUntrustedCertificate>True</AllowUntrustedCertificate>
            </PropertyGroup>
          </Project>
          "@
          [System.IO.File]::WriteAllText((Join-Path $profileDirectory "MonsterAsp.pubxml"), $profileXml)
      - name: Publish to MonsterASP.NET through Web Deploy
        run: dotnet publish backend/src/GroceryStore.Api/GroceryStore.Api.csproj --configuration Release --no-restore -p:PublishProfile=MonsterAsp
      - name: Verify public health endpoint
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "https://piupiu.runasp.net/health" -UseBasicParsing -TimeoutSec 60
          if ($response.StatusCode -ne 200) { throw "Health endpoint returned $($response.StatusCode)." }
