name: migrate-production-database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE_PRODUCTION to apply pending EF Core migrations
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'MIGRATE_PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore backend/GroceryStore.sln

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.9
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply EF Core migrations
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.MONSTERASP_SQL_CONNECTION_STRING }}
        run: >-
          dotnet ef database update
          --project backend/src/GroceryStore.Persistence/GroceryStore.Persistence.csproj
          --startup-project backend/src/GroceryStore.Api/GroceryStore.Api.csproj
          --configuration Release
