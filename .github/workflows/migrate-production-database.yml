name: migrate-production-database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE_PRODUCTION to apply pending EF Core migrations
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'MIGRATE_PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore backend/GroceryStore.sln

      - name: Restore EF Core CLI
        run: dotnet tool restore

      - name: Apply EF Core migrations
        env:
          ASPNETCORE_ENVIRONMENT: Production
          PRODUCTION_SQL_CONNECTION_STRING: ${{ secrets.MONSTERASP_SQL_CONNECTION_STRING }}
        run: |
          export ConnectionStrings__DefaultConnection="${PRODUCTION_SQL_CONNECTION_STRING};TrustServerCertificate=True"
          dotnet ef database update \
            --project backend/src/GroceryStore.Persistence/GroceryStore.Persistence.csproj \
            --startup-project backend/src/GroceryStore.Api/GroceryStore.Api.csproj \
            --configuration Release
