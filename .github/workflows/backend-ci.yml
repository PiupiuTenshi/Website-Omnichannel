name: backend-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/Test-ApiSqlServer.ps1'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
      - develop
      - 'phase/**'
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'backend/**'
      - 'scripts/Test-ApiSqlServer.ps1'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/GroceryStore.sln
      - name: Build
        run: dotnet build backend/GroceryStore.sln --configuration Release --no-restore
      - name: Format
        # EF-generated migrations preserve their generated formatting and are validated by build/tests.
        run: dotnet format backend/GroceryStore.sln --verify-no-changes --no-restore --exclude backend/src/GroceryStore.Persistence/Migrations
      - name: Test
        run: dotnet test backend/GroceryStore.sln --configuration Release --no-build

  sql-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: SmokeOnly!${{ github.run_id }}
        ports:
          - 1433:1433
    env:
      SQLCMDPASSWORD: SmokeOnly!${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Wait for SQL Server
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          for attempt in {1..40}; do
            if docker exec --env SQLCMDPASSWORD "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'SQL Server did not accept connections.' >&2
          exit 1
      - name: Migrate, seed and verify the API over HTTP
        shell: pwsh
        run: |
          $env:ConnectionStrings__DefaultConnection = "Server=127.0.0.1,1433;Database=OmnichannelApiSmoke;User ID=sa;Password=$env:SQLCMDPASSWORD;Encrypt=True;TrustServerCertificate=True"
          & ./scripts/Test-ApiSqlServer.ps1 | Tee-Object -Variable smokeOutput
          $smokeOutput | Where-Object { $_ -like 'PASS *' } | ForEach-Object { "- $_" } | Add-Content -Path $env:GITHUB_STEP_SUMMARY
