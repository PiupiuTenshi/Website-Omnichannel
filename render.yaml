services:
  - type: web
    name: tap-hoa-chi-to-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Issuer
        value: TapHoaChiTo
      - key: Jwt__Audience
        value: TapHoaChiTo.Web
      - key: Jwt__Key
        sync: false
      - key: Jwt__AccessTokenLifetimeMinutes
        value: "15"
      - key: Cors__AllowedOrigins__0
        value: https://website-omnichannel.pages.dev
      - key: Store__Name
        value: Tap hoa chi To
      - key: Store__Email
        sync: false
      - key: Store__Address
        sync: false
      - key: Store__PhoneNumbers
        sync: false
      - key: Goong__ApiKey
        sync: false
      - key: Goong__OriginAddress
        sync: false
      - key: Goong__AutoShippingRadiusKm
        value: "5"
      - key: Goong__BaseShippingFee
        value: "10000"
      - key: ImageStorage__Provider
        value: Local
      - key: ImageStorage__LocalRootPath
        value: App_Data/product-images
      - key: ImageStorage__MaxUploadBytes
        value: "5242880"
      - key: ImageStorage__MaxImageDimension
        value: "1600"
      - key: ImageStorage__WebpQuality
        value: "82"
      - key: Smtp__Provider
        value: Mock
      - key: Smtp__Host
        value: smtp.example.com
      - key: Smtp__Port
        value: "587"
      - key: Smtp__UserName
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__FromEmail
        sync: false
      - key: Smtp__FromName
        value: Tap hoa chi To
      - key: Sms__Provider
        value: Mock
      - key: Sms__ApiKey
        sync: false
      - key: Sms__Sender
        value: TapHoaChiTo
      - key: Order__PendingReservationMinutes
        value: "10"
      - key: Print__ReceiptPaperWidthMm
        value: "58"
      - key: Print__PriceTagWidthMm
        value: "40"
      - key: Print__PriceTagHeightMm
        value: "60"
      - key: DemoIdentity__Enabled
        value: "false"
